<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TS Trainer — 書いて覚えるTypeScript</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #171a23;
    --panel2: #1e222e;
    --border: #2a2f3e;
    --text: #d7dae3;
    --dim: #8a90a3;
    --accent: #4d9fec;
    --green: #4ade80;
    --red: #f87171;
    --yellow: #fbbf24;
    --mono: "SF Mono", Menlo, Consolas, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    height: 100vh; display: flex; overflow: hidden;
  }

  /* ---- sidebar ---- */
  #sidebar {
    width: 260px; min-width: 260px; background: var(--panel);
    border-right: 1px solid var(--border); overflow-y: auto; padding: 16px 0;
  }
  #sidebar h1 { font-size: 16px; padding: 0 16px 4px; color: var(--accent); }
  #sidebar .sub { font-size: 11px; color: var(--dim); padding: 0 16px 12px; }
  #progressbar { height: 6px; background: var(--panel2); border-radius: 3px; margin: 0 16px 16px; overflow: hidden; }
  #progressbar > div { height: 100%; background: var(--green); width: 0%; transition: width .3s; }
  .chapter { font-size: 12px; color: var(--dim); padding: 12px 16px 4px; font-weight: 600; }
  .lesson {
    padding: 7px 16px 7px 28px; font-size: 13px; cursor: pointer;
    display: flex; align-items: center; gap: 8px; border-left: 3px solid transparent;
  }
  .lesson:hover { background: var(--panel2); }
  .lesson.active { background: var(--panel2); border-left-color: var(--accent); }
  .lesson .mark { width: 16px; text-align: center; color: var(--dim); }
  .lesson.done .mark { color: var(--green); }
  .lesson.review .mark { color: var(--yellow); }

  /* ---- main ---- */
  #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  #desc {
    padding: 20px 24px; overflow-y: auto; max-height: 38%;
    border-bottom: 1px solid var(--border); background: var(--panel);
  }
  #desc h2 { font-size: 18px; margin-bottom: 8px; }
  #desc p { font-size: 14px; line-height: 1.7; margin-bottom: 8px; color: var(--text); }
  #desc a { color: var(--accent); }
  #desc code, #output code {
    font-family: var(--mono); font-size: 12.5px; background: var(--panel2);
    padding: 1px 5px; border-radius: 4px; color: var(--yellow);
  }
  #desc pre {
    background: var(--panel2); padding: 10px 12px; border-radius: 6px;
    font-family: var(--mono); font-size: 12.5px; line-height: 1.5;
    margin: 8px 0; overflow-x: auto; color: var(--text);
  }
  .task { border-left: 3px solid var(--accent); padding-left: 10px; margin-top: 10px; }
  .resbox {
    margin-top: 12px; padding: 8px 12px; background: var(--panel2);
    border-radius: 6px; font-size: 12.5px; color: var(--dim); line-height: 1.7;
  }

  #editorwrap { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  #toolbar {
    display: flex; gap: 8px; padding: 8px 24px; align-items: center;
    background: var(--panel); border-bottom: 1px solid var(--border);
  }
  button {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    padding: 6px 14px; border-radius: 6px; font-size: 13px; cursor: pointer;
    font-family: inherit;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #0b0d12; border: none; font-weight: 600; }
  button.primary:hover { opacity: .9; }
  #toolbar .spacer { flex: 1; }
  #toolbar .kbd { font-size: 11px; color: var(--dim); }

  #editor {
    flex: 1; width: 100%; background: var(--bg); color: var(--text); border: none;
    resize: none; outline: none; padding: 14px 24px;
    font-family: var(--mono); font-size: 14px; line-height: 1.6; tab-size: 2;
  }

  #output {
    height: 32%; min-height: 140px; overflow-y: auto; background: var(--panel);
    border-top: 1px solid var(--border); padding: 12px 24px; font-size: 13px;
  }
  #output .test { font-family: var(--mono); font-size: 12.5px; padding: 3px 0; }
  #output .pass { color: var(--green); }
  #output .fail { color: var(--red); }
  #output .err { color: var(--red); font-family: var(--mono); font-size: 12.5px; white-space: pre-wrap; }
  #output .log { color: var(--dim); font-family: var(--mono); font-size: 12.5px; }
  #output .celebrate { color: var(--green); font-weight: 600; margin-top: 8px; }
  #output .review-note { color: var(--yellow); font-weight: 600; margin-top: 8px; }
  #output .muted { color: var(--dim); }
  .hintbox {
    background: var(--panel2); border: 1px solid var(--border); border-radius: 6px;
    padding: 10px 12px; margin-top: 10px; font-size: 13px; line-height: 1.7;
  }
  .hintbox pre { background: var(--bg); padding: 8px 10px; border-radius: 4px; font-family: var(--mono); font-size: 12.5px; margin-top: 6px; overflow-x: auto; }

  /* ---- スマホ幅: サイドバーを上に積み、ページ全体をスクロールさせる ---- */
  @media (max-width: 720px) {
    body { display: block; height: auto; overflow: visible; }
    #sidebar {
      width: auto; min-width: 0; max-height: 32vh;
      border-right: none; border-bottom: 1px solid var(--border);
    }
    #main { overflow: visible; }
    #desc { max-height: none; padding: 16px; }
    #toolbar { flex-wrap: wrap; padding: 8px 16px; }
    #toolbar .spacer, #toolbar .kbd { display: none; }
    #editor { min-height: 45vh; padding: 12px 16px; font-size: 16px; } /* 16px 未満だと iOS がフォーカス時にズームする */
    #output { height: auto; padding: 12px 16px; }
  }
</style>
</head>
<body>

<nav id="sidebar">
  <h1>TS Trainer</h1>
  <div class="sub">書いて覚えるTypeScript全20問</div>
  <div id="progressbar"><div></div></div>
  <div id="nav"></div>
</nav>

<div id="main">
  <div id="desc"></div>
  <div id="editorwrap">
    <div id="toolbar">
      <button class="primary" id="btn-run">▶ 実行して採点</button>
      <button id="btn-hint">ヒント</button>
      <button id="btn-solution">解答例</button>
      <button id="btn-reset">リセット</button>
      <span class="spacer"></span>
      <span class="kbd">⌘+Enter / Ctrl+Enter で実行</span>
    </div>
    <textarea id="editor" spellcheck="false"></textarea>
  </div>
  <div id="output"><span class="muted">型注釈を書いて「実行して採点」を押してください。</span></div>
</div>

<script id="engine">
"use strict";

/* ============ テストヘルパー ============ */
function fmt(v) {
  if (typeof v === "string") return JSON.stringify(v);
  if (typeof v === "function") return "[function]";
  try { return JSON.stringify(v) ?? String(v); } catch { return String(v); }
}
function deepEq(a, b) {
  if (Object.is(a, b)) return true;
  if (typeof a !== "object" || typeof b !== "object" || a === null || b === null) return false;
  if (Array.isArray(a) !== Array.isArray(b)) return false;
  const ka = Object.keys(a), kb = Object.keys(b);
  if (ka.length !== kb.length) return false;
  return ka.every(k => deepEq(a[k], b[k]));
}
function eq(name, got, want) {
  return deepEq(got, want)
    ? { pass: true, name }
    : { pass: false, name, detail: `期待値 ${fmt(want)} / 実際 ${fmt(got)}` };
}
function check(name, cond, detail) {
  return cond ? { pass: true, name } : { pass: false, name, detail };
}
function T(name, run) { return { name, run }; }
// TC: 型注釈のソースチェック。not=true なら「書かれていないこと」を確認
function TC(name, re, detail, not) { return { name, re, detail, not: !!not }; }

/* ============ 型ストリッパー ============
   採点用に、TSの型注釈だけを取り除いてJSとして実行できる形にする。
   このドリルで扱う構文（注釈・interface・type・ジェネリクス・as）に絞った軽量版。 */

function skipStringRaw(s, i) {
  const q = s[i]; i++;
  while (i < s.length) {
    if (s[i] === "\\") { i += 2; continue; }
    if (s[i] === q) return i + 1;
    if (q === "`" && s[i] === "$" && s[i + 1] === "{") {
      let d = 1; i += 2;
      while (i < s.length && d > 0) {
        if (s[i] === "\\") i++;
        else if (s[i] === "{") d++;
        else if (s[i] === "}") d--;
        i++;
      }
      continue;
    }
    i++;
  }
  return i;
}
function skipComment(s, i) {
  if (s[i + 1] === "/") { while (i < s.length && s[i] !== "\n") i++; return i; }
  i += 2;
  while (i < s.length && !(s[i] === "*" && s[i + 1] === "/")) i++;
  return Math.min(i + 2, s.length);
}

// 文字列リテラル・コメントの中身を空白で塗りつぶした「同じ長さ」の文字列を返す。
// テンプレートの \${...} の中はコードなので残す。keepStrings=true ならコメントだけ塗る。
// 正規表現での書き換えが文字列やコメントの中身に当たらないようにするために使う。
function maskLiterals(s, keepStrings) {
  const a = s.split("");
  const n = s.length;
  let i = 0;
  const blank = (from, to) => { for (let k = from; k < to && k < n; k++) if (a[k] !== "\n") a[k] = " "; };
  function code(inTemplateExpr) {
    let depth = 0;
    while (i < n) {
      const c = s[i];
      if (c === '"' || c === "'") {
        const j = skipStringRaw(s, i);
        if (!keepStrings) blank(i + 1, s[j - 1] === c && j - 1 > i ? j - 1 : j);
        i = j;
      }
      else if (c === "`") template();
      else if (c === "/" && (s[i + 1] === "/" || s[i + 1] === "*")) { const j = skipComment(s, i); blank(i, j); i = j; }
      else if (c === "{") { depth++; i++; }
      else if (c === "}") { if (inTemplateExpr && depth === 0) return; depth--; i++; }
      else i++;
    }
  }
  function template() {
    i++;
    while (i < n) {
      const c = s[i];
      if (c === "\\") { if (!keepStrings) blank(i, i + 2); i += 2; continue; }
      if (c === "`") { i++; return; }
      if (c === "$" && s[i + 1] === "{") { i += 2; code(true); i++; continue; }
      if (!keepStrings) blank(i, i + 1);
      i++;
    }
  }
  code(false);
  return a.join("");
}

// re のマッチ位置を maskLiterals 済みの文字列で探し、元の文字列の同じ範囲を置き換える。
// rep は "" か "$1"（どちらもコード部分しか含まない）。
function replaceInCode(s, re, rep) {
  const mask = maskLiterals(s, false);
  let out = "", last = 0;
  for (const m of mask.matchAll(re)) {
    out += s.slice(last, m.index) + (rep === "$1" ? (m[1] ?? "") : rep);
    last = m.index + m[0].length;
  }
  return out + s.slice(last);
}

// `:` の直後から型表現を読み飛ばし、型の終わった位置を返す
function skipType(s, start) {
  const n = s.length;
  let i = start;
  let last = start;
  function balanced(open, close) {
    let d = 0;
    while (i < n) {
      const c = s[i];
      if (c === '"' || c === "'" || c === "`") { i = skipStringRaw(s, i); continue; }
      if (c === open) d++;
      else if (c === close) { d--; if (d === 0) { i++; return; } }
      i++;
    }
  }
  function term() {
    let j = i;
    while (j < n && /\s/.test(s[j])) j++;
    if (j >= n) return false;
    const c = s[j];
    if (c === '"' || c === "'") { i = skipStringRaw(s, j); }
    else if (c === "{") { i = j; balanced("{", "}"); }
    else if (c === "(") {
      i = j; balanced("(", ")");
      let k = i;
      while (k < n && /\s/.test(s[k])) k++;
      if (s[k] === "=" && s[k + 1] === ">") { i = k + 2; if (!term()) return false; }
    }
    else if (/[\w$]/.test(c)) {
      i = j;
      while (i < n && /[\w$.]/.test(s[i])) i++;
      let k = i;
      while (k < n && /\s/.test(s[k])) k++;
      if (s[k] === "<") { i = k; balanced("<", ">"); }
    }
    else if (/\d/.test(c) || (c === "-" && /\d/.test(s[j + 1] || ""))) {
      i = j + 1;
      while (i < n && /[\d.]/.test(s[i])) i++;
    }
    else return false;
    // 配列サフィックス number[] / T[][]
    while (true) {
      let k = i;
      while (k < n && /\s/.test(s[k])) k++;
      if (s[k] === "[" && s[k + 1] === "]") { i = k + 2; } else break;
    }
    last = i;
    return true;
  }
  if (!term()) return last;
  while (true) {
    let k = i;
    while (k < n && /\s/.test(s[k])) k++;
    if (s[k] === "|" || s[k] === "&") { i = k + 1; if (!term()) break; }
    else break;
  }
  return last;
}

// 注釈（: 型 / 引数の ?）を文脈判定しながら除去する
function stripAnnotations(src) {
  const n = src.length;
  let out = "";
  let i = 0;
  const stack = [];   // "paren" | "block" | "object" | "bracket"
  const tern = [0];   // 深さごとの三項演算子カウント
  const isId = c => /[\w$]/.test(c);
  const ctx = () => stack.length ? stack[stack.length - 1] : "top";

  function prevInfo() {
    let j = out.length - 1;
    while (j >= 0 && /\s/.test(out[j])) j--;
    return { ch: j >= 0 ? out[j] : "", idx: j };
  }
  function wordEndingAt(idx) {
    let j = idx;
    while (j >= 0 && isId(out[j])) j--;
    return out.slice(j + 1, idx + 1);
  }
  function wordBeforeWord(idx) {
    let j = idx;
    while (j >= 0 && isId(out[j])) j--;
    while (j >= 0 && /\s/.test(out[j])) j--;
    const end = j;
    while (j >= 0 && isId(out[j])) j--;
    return out.slice(j + 1, end + 1);
  }

  while (i < n) {
    const c = src[i];
    if (c === '"' || c === "'" || c === "`") { const j = skipStringRaw(src, i); out += src.slice(i, j); i = j; continue; }
    if (c === "/" && (src[i + 1] === "/" || src[i + 1] === "*")) { const j = skipComment(src, i); out += src.slice(i, j); i = j; continue; }

    if (c === "(") { stack.push("paren"); tern.push(0); out += c; i++; continue; }
    if (c === "[") { stack.push("bracket"); tern.push(0); out += c; i++; continue; }
    if (c === "{") {
      const p = prevInfo();
      let kind = "block";
      if (["=", "(", ",", "[", ":", "?", "|", "&"].includes(p.ch)) kind = "object";
      else if (isId(p.ch)) {
        const w = wordEndingAt(p.idx);
        if (["return", "typeof", "in", "of", "new", "case"].includes(w)) kind = "object";
      }
      if (p.ch === ">" && p.idx > 0 && out[p.idx - 1] === "=") kind = "block"; // => { はアロー本体
      stack.push(kind); tern.push(0);
      out += c; i++; continue;
    }
    if (c === ")" || c === "]" || c === "}") {
      if (stack.length) { stack.pop(); tern.pop(); }
      out += c; i++; continue;
    }

    if (c === "?") {
      if (src[i + 1] === ".") { out += "?."; i += 2; continue; }
      if (src[i + 1] === "?") { out += "??"; i += 2; continue; }
      let k = i + 1;
      while (k < n && /\s/.test(src[k])) k++;
      const p = prevInfo();
      if (ctx() === "paren" && isId(p.ch) && (src[k] === ":" || src[k] === "," || src[k] === ")")) {
        i++; continue; // オプショナル引数の ? を除去
      }
      tern[tern.length - 1]++;
      out += c; i++; continue;
    }

    if (c === ":") {
      if (tern[tern.length - 1] > 0) { tern[tern.length - 1]--; out += c; i++; continue; }
      const cx = ctx();
      if (cx === "object" || cx === "bracket") { out += c; i++; continue; }
      const p = prevInfo();
      let ann = false;
      if (p.ch === ")") ann = true; // 戻り値の型
      else if ((p.ch === "}" || p.ch === "]") && cx === "paren") ann = true; // 分割代入引数の注釈
      else if (isId(p.ch)) {
        const w = wordEndingAt(p.idx);
        if (cx === "paren") ann = w !== "case";
        else if (w !== "default") {
          const before = wordBeforeWord(p.idx);
          if (["const", "let", "var"].includes(before)) ann = true; // 変数宣言の注釈
        }
      }
      if (ann) { i = skipType(src, i + 1); continue; }
      out += c; i++; continue;
    }

    out += c; i++;
  }
  return out;
}

function stripTypes(src) {
  let s = src;
  // 以下の正規表現は文字列・コメントの中には当てない（"known as X" などを壊さないため）
  // interface ブロック（ネスト1段まで）
  s = replaceInCode(s, /(^|[\n;])[ \t]*(export\s+)?interface\s+[\w$]+(\s+extends\s+[\w$.,<>\s]+?)?\s*\{[^{}]*(\{[^{}]*\}[^{}]*)*\}/g, "$1");
  // type エイリアス
  s = replaceInCode(s, /(^|[\n;])[ \t]*(export\s+)?type\s+[\w$]+(\s*<[^<>]*>)?\s*=\s*(\{[^{}]*\}|[^;{}\n])*;?/g, "$1");
  // as キャスト
  s = replaceInCode(s, /\s+as\s+const\b/g, "");
  s = replaceInCode(s, /\s+as\s+[\w$.]+(\s*<[^<>]*>)?(\s*\[\s*\])*/g, "");
  // function 宣言のジェネリクスパラメータ
  s = replaceInCode(s, /\b(function\s+[\w$]+)\s*<[^<>]*>/g, "$1");
  return stripAnnotations(s);
}

/* ============ 実行エンジン ============ */
function withTimeout(p, ms) {
  return Promise.race([
    Promise.resolve(p),
    new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms)),
  ]);
}

async function runCode(lesson, code) {
  const results = [];
  // 1) 型注釈のチェック（ソースに対する軽量チェック）
  //    コメントは除いて検査する（コメントに書いただけで合格／コメント内の any で不合格、を防ぐ）
  const noComments = maskLiterals(code, true);
  for (const tc of lesson.typeChecks ?? []) {
    const found = tc.re.test(noComments);
    const ok = tc.not ? !found : found;
    results.push(ok
      ? { pass: true, name: "[型] " + tc.name }
      : { pass: false, name: "[型] " + tc.name, detail: tc.detail });
  }
  // 2) 型を取り除いてJSとして実行
  const logs = [];
  const fakeConsole = {
    log: (...a) => logs.push(a.map(v => typeof v === "string" ? v : fmt(v)).join(" ")),
    warn: (...a) => logs.push("[warn] " + a.map(String).join(" ")),
    error: (...a) => logs.push("[error] " + a.map(String).join(" ")),
  };
  let stripped;
  try { stripped = stripTypes(code); }
  catch (e) { return { error: "型注釈の解析に失敗しました: " + e.message, results, logs }; }

  const names = Array.isArray(lesson.expose) ? lesson.expose : [lesson.expose];
  let val;
  try {
    const retExpr = "{" + names.map(nm => `${nm}: (typeof ${nm} === "undefined" ? undefined : ${nm})`).join(",") + "}";
    const factory = new Function("console", `"use strict";\n${stripped}\n;return ${retExpr};`);
    const bag = factory(fakeConsole);
    val = Array.isArray(lesson.expose) ? bag : bag[lesson.expose];
  } catch (e) {
    return { error: `${e.name}: ${e.message}`, results, logs };
  }
  if (!Array.isArray(lesson.expose)) {
    if (lesson.kind === "value") {
      if (val === undefined) return { error: `変数 ${lesson.expose} が定義されていません（名前を確認してください）`, results, logs };
    } else if (typeof val !== "function") {
      return { error: `関数 ${lesson.expose} が定義されていません（名前を確認してください）`, results, logs };
    }
  }
  for (const t of lesson.tests ?? []) {
    try {
      results.push(await withTimeout(t.run(val, { logs }), 3000));
    } catch (e) {
      results.push({ pass: false, name: t.name, detail: e.message === "timeout" ? "3秒以内に完了しませんでした" : `例外: ${e.message}` });
    }
  }
  return { results, logs };
}

/* ============ カリキュラム ============ */
const CHAPTERS = [
{
  title: "第1章 基本の型",
  resources: [
    { label: "Handbook: Everyday Types", url: "https://www.typescriptlang.org/docs/handbook/2/everyday-types.html" },
  ],
  lessons: [
  {
    id: "annotate", expose: ["title", "bpm", "isPlaying"], title: "型注釈の基本",
    desc: `<h2>1-1. 型注釈 — 変数に型を書く</h2>
<p>TypeScriptはJavaScriptに<b>型の宣言</b>を足した言語です。変数名の直後に <code>: 型</code> と書くのが<b>型注釈</b>。合わない値を入れようとすると、実行前（コンパイル時）にエラーで教えてくれます。</p>
<pre>let bpm: number = 128;
bpm = "fast"; // ← コンパイルエラー: string は number に入れられない</pre>
<p>基本の型は <code>string</code>・<code>number</code>・<code>boolean</code> の3つ。JSの <code>typeof</code> が返す名前と同じです。</p>

for (const ch of CHAPTERS) for (const l of ch.lessons) l.ch = ch;
const ALL = CHAPTERS.flatMap(ch => ch.lessons);

<script>
"use strict";

/* ============ 状態管理（進捗＋軽いSRS） ============ */
const STORE_KEY = "ts-trainer-v1";
function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE_KEY));
    // 壊れた値・別形式の値（配列や数値など）は捨てて初期状態から始める
    return s && typeof s === "object" && !Array.isArray(s) ? s : {};
  }
  catch { return {}; }
}
function saveState(s) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch { /* file:// 等で失敗しても続行 */ }
}
// state = { __seq: 通算クリア数, [lessonId]: { code, done, lapses, clearedSeq } }
let state = loadState();

// 一度でも間違えた問題は、クリア後も「3問クリアするごと」に復習として再出題する
function dueReview(l) {
  const st = state[l.id];
  return !!(st?.done && (st.lapses ?? 0) > 0 && (state.__seq ?? 0) - (st.clearedSeq ?? 0) >= 3);
}
let current = ALL.find(l => !(state[l.id]?.done)) ?? ALL.find(dueReview) ?? ALL[0];

/* ============ UI ============ */
const $nav = document.getElementById("nav");
const $desc = document.getElementById("desc");
const $editor = document.getElementById("editor");
const $output = document.getElementById("output");
const $bar = document.querySelector("#progressbar > div");

function renderNav() {
  $nav.textContent = "";
  for (const ch of CHAPTERS) {
    const h = document.createElement("div");
    h.className = "chapter";
    h.textContent = ch.title;
    $nav.append(h);
    for (const l of ch.lessons) {
      const st = state[l.id];
      const due = dueReview(l);
      const el = document.createElement("div");
      el.className = "lesson" + (l === current ? " active" : "") + (st?.done ? (due ? " review" : " done") : "");
      const mark = document.createElement("span");
      mark.className = "mark";
      mark.textContent = st?.done ? (due ? "🔁" : "✓") : "○";
      const label = document.createElement("span");
      label.textContent = l.title;
      el.append(mark, label);
      el.addEventListener("click", () => selectLesson(l));
      $nav.append(el);
    }
  }
  const doneCount = ALL.filter(l => state[l.id]?.done).length;
  $bar.style.width = `${Math.round(doneCount / ALL.length * 100)}%`;
}

function resBoxHTML(ch) {
  const links = ch.resources.map(r =>
    `<a href="${r.url}" target="_blank" rel="noopener">${r.label}</a>`).join(" ・ ");
  return `<div class="resbox">📚 深めるなら: ${links} ・ <a href="https://www.typescriptlang.org/play" target="_blank" rel="noopener">TypeScript Playground</a><br>※このドリルの採点は簡易チェックです。厳密な型検査は Playground に貼って試せます。</div>`;
}

function selectLesson(lesson) {
  persistCode();
  current = lesson;
  $desc.innerHTML = lesson.desc + resBoxHTML(lesson.ch);
  const saved = state[lesson.id]?.code;
  $editor.value = typeof saved === "string" && saved.trim() ? saved : lesson.starter;
  editorLoaded = true;
  $output.innerHTML = `<span class="muted">型注釈を書いて「実行して採点」を押してください。</span>`;
  renderNav();
  $editor.focus();
}

let editorLoaded = false;
function persistCode() {
  if (!current || !editorLoaded) return;
  state = { ...state, [current.id]: { ...state[current.id], code: $editor.value } };
  saveState(state);
}

let runToken = 0;
async function run() {
  persistCode();
  const token = ++runToken;
  const lesson = current;
  $output.innerHTML = `<span class="muted">採点中...</span>`;
  const { error, results, logs } = await runCode(lesson, $editor.value);
  if (token !== runToken || lesson !== current) return; // 実行中に切替/再実行された
  $output.textContent = "";

  for (const line of logs ?? []) {
    const d = document.createElement("div");
    d.className = "log";
    d.textContent = "› " + line;
    $output.append(d);
  }
  let allPass = !error;
  for (const r of results ?? []) {
    const d = document.createElement("div");
    d.className = "test " + (r.pass ? "pass" : "fail");
    d.textContent = (r.pass ? "✓ " : "✗ ") + r.name + (r.pass || !r.detail ? "" : ` — ${r.detail}`);
    $output.append(d);
    if (!r.pass) allPass = false;
  }
  if (error) {
    const d = document.createElement("div");
    d.className = "err";
    d.textContent = "✗ " + error;
    $output.append(d);
  }

  const st = state[lesson.id] ?? {};
  if (!allPass) {
    // 失敗を記録 → クリア済みの問題ならのちほど復習として再出題される
    state = { ...state, [lesson.id]: { ...st, code: $editor.value, lapses: (st.lapses ?? 0) + 1 } };
    saveState(state);
    renderNav();
    return;
  }
  const wasDue = dueReview(lesson);
  const seq = (state.__seq ?? 0) + 1;
  state = {
    ...state, __seq: seq,
    [lesson.id]: { ...st, code: $editor.value, done: true, clearedSeq: seq, lapses: wasDue ? 0 : (st.lapses ?? 0) },
  };
  saveState(state);
  renderNav();

  const review = ALL.find(l => l !== lesson && dueReview(l));
  const next = ALL.find(l => !(state[l.id]?.done));
  const d = document.createElement("div");
  if (review) {
    d.className = "review-note";
    d.textContent = `🔁 クリア！ 以前間違えた「${review.title}」が復習に出ています（サイドバーの🔁）`;
  } else if (next) {
    d.className = "celebrate";
    d.textContent = `🎉 クリア！ 次は「${next.title}」へ（サイドバーから選択）`;
  } else {
    d.className = "celebrate";
    d.textContent = "🏆 全問クリア！おめでとうございます！";
  }
  $output.append(d);
}

function showHint() {
  const box = document.createElement("div");
  box.className = "hintbox";
  box.textContent = "💡 " + current.hint;
  $output.append(box);
}

function showSolution() {
  const box = document.createElement("div");
  box.className = "hintbox";
  const label = document.createElement("div");
  label.textContent = "📖 解答例（まず自力で5分は粘るのがおすすめ）";
  const pre = document.createElement("pre");
  pre.textContent = current.solution;
  box.append(label, pre);
  $output.append(box);
}

document.getElementById("btn-run").addEventListener("click", run);
document.getElementById("btn-hint").addEventListener("click", showHint);
document.getElementById("btn-solution").addEventListener("click", showSolution);
document.getElementById("btn-reset").addEventListener("click", () => {
  $editor.value = current.starter;
  persistCode();
});

$editor.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); run(); }
  if (e.key === "Tab") {
    e.preventDefault();
    const { selectionStart: s, selectionEnd: end, value } = $editor;
    $editor.value = value.slice(0, s) + "  " + value.slice(end);
    $editor.selectionStart = $editor.selectionEnd = s + 2;
  }
});
$editor.addEventListener("input", () => persistCode());

renderNav();
selectLesson(current);
</script>
</body>
</html>
